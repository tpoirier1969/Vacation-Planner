<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ideas and Itinerary mobile QA</title><style>body{font-family:system-ui;background:#f3eee2;padding:14px;color:#243e3c}.cases{display:flex;align-items:flex-start;flex-wrap:wrap;gap:12px}.case{max-width:100%}.case h2{font-size:13px}.case iframe{border:2px solid #bca988;max-width:100%;background:white}#result{font-weight:800}</style></head><body><h1>Ideas and Itinerary responsive check</h1><p>Representative items; same staged mobile styles. No login and no data writes.</p><div id="result">Checking…</div><div id="cases" class="cases"></div><script>const sample="<!doctype html><html><head><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><link rel=\"stylesheet\" href=\"./planner.css?v=ideas-itinerary-qa\"></head><body class=\"mobile-workspace\" style=\"height:auto;overflow:auto;padding:0;margin:0\"><div class=\"shell\" style=\"width:100%;padding:0\"><div id=\"workspace\"><section id=\"places\" class=\"panel\" style=\"overflow:visible\"><div class=\"grid\"><div class=\"card\"><div class=\"mobile-card-heading\"><h2>Considering</h2><button id=\"mobileShowIdeaForm\" class=\"secondary\">+ Add idea</button></div><div class=\"ideas-filter\"><label for=\"ideaCategoryFilter\">Show category</label><select id=\"ideaCategoryFilter\"><option>All categories (42)</option></select><span class=\"muted\">12 of 42 ideas</span></div><div class=\"idea-search-row\"><input type=\"search\" placeholder=\"Search ideas, notes, locations…\" aria-label=\"Search ideas\"><button class=\"quiet small\">Clear</button></div><div id=\"placeList\"><details class=\"list-category\" open><summary>Restaurants <span class=\"count\">2</span></summary><div class=\"category-body\"><div class=\"day\"><div class=\"row entry-head\"><strong>Long Name of a Restaurant in the Greater Yellowstone National Park Area</strong><label class=\"idea-category-inline\">Category <select><option>Restaurants</option></select></label><span class=\"entry-actions\"><button class=\"quiet small\">Edit</button><button class=\"quiet small\">Remove</button></span></div><div class=\"muted small-details\">West Yellowstone, Montana</div><p>Interesting for an evening dinner and a possible reservation.</p><div class=\"row wrap\"><button class=\"secondary small\">Choose for itinerary</button></div></div></div></details></div></div></div></section><section id=\"itinerary\" class=\"panel\" style=\"overflow:visible\"><div class=\"grid\"><div class=\"card\"><div class=\"mobile-card-heading\"><h2>Decided plans</h2><button id=\"mobileShowActivityForm\" class=\"secondary\">+ Add plan</button></div><div class=\"itinerary-toolbar\"><label for=\"itineraryView\">Show plans</label><select id=\"itineraryView\"><option>Needs booking</option></select><span class=\"muted\">8 plans · 2 unscheduled · 3 need booking</span></div><div id=\"activityList\"><section class=\"itinerary-group\"><h3>Dec 21, 2026 <span class=\"count\">1</span></h3><div class=\"day\"><div class=\"row entry-head\"><strong>Christmas Tree Lighting at the Old Faithful Historic Lodge</strong><span class=\"entry-actions\"><button class=\"quiet small\">Edit</button><button class=\"quiet small\">Remove</button></span></div><div class=\"itinerary-badges\"><span class=\"itinerary-badge important\">Must do</span><span class=\"itinerary-badge pending\">Needs booking</span></div><div class=\"muted small-details\">Events · 6:00 PM</div><div class=\"row wrap\"><button class=\"quiet small\">Move back to Ideas</button></div></div></section></div></div></div></section></div></div></body></html>";const sizes=[320,375,390,430,720],target=document.getElementById('cases'),results=[];
for(const width of sizes){
 const frame=document.createElement('iframe');frame.width=width;frame.height=640;frame.title='Ideas and Itinerary at '+width+' px';
 const item=document.createElement('div');item.className='case';
 const label=document.createElement('h2');label.textContent=width+' px';
 item.append(label,frame);target.append(item);
 frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const layout=doc.documentElement.scrollWidth,viewport=doc.documentElement.clientWidth;
  const places=doc.querySelector('#placeList'),itinerary=doc.querySelector('#activityList');
  const checks=!!places&&!!itinerary&&places.getBoundingClientRect().width>140&&itinerary.getBoundingClientRect().width>140&&layout<=viewport+2;
  label.textContent=width+' px — '+(checks?'PASS':'OVERFLOW')+' (document '+layout+'/'+viewport+')';
  results.push({width,passed:checks,scrollWidth:layout,viewport});
  if(results.length===sizes.length){
   document.getElementById('result').textContent=results.every(x=>x.passed)?'ALL FIVE WIDTHS PASS':'MOBILE OVERFLOW DETECTED';
   window.ideaItineraryQA=results;
  }
 });
 frame.srcdoc=sample;
}</script></body></html>
