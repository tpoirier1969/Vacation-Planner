<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route editor responsive QA — read only</title><style>body{font:14px system-ui;margin:20px;background:#f7f3e9;color:#1a3636}.tests{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}.case{width:max-content;max-width:100%}.case h2{font-size:14px;margin:0 0 7px}.case iframe{border:2px solid #736e63;display:block;background:#fff;max-width:100%}#result{padding:10px 0;font-weight:700}small{color:#586b63}</style></head><body><h1 style="font-size:20px">Route editor — narrow-screen layout QA</h1><p>Representative route controls, same route editor stylesheet, no login and no saved-data writes.</p><div id="result">Checking visible route controls…</div><div id="cases" class="tests"></div><script>
const sample=String.raw\`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../planner.css?v=route-section-qa"></head><body class="mobile-workspace" style="margin:0;padding:0"><div style="width:100%;padding:12px;box-sizing:border-box"><div class="card explore-side" style="width:100%;min-width:0"><div id="exploreRoutePanel"><div id="routeControls"><label class="field">Route name<input value="Marquette to Yellowstone via scenic backroads"></label><div class="route-point"><label class="field">Starting point<input value="Marquette, Michigan"></label><div class="row wrap"><button class="quiet small">Find</button><button class="quiet small">Pick on map</button><button class="quiet small">Remove start</button></div></div><div class="route-point"><label class="field">Destination<input value="Yellowstone National Park, Wyoming"></label><div class="row wrap"><button class="quiet small">Find</button><button class="quiet small">Pick on map</button><button class="quiet small">Remove destination</button></div></div><div class="route-waypoints-header route-sections-heading"><strong>Driving sections · travel order</strong><button class="quiet small">Undo</button></div><div class="route-section-toolbar"><span>3 sections · 1 skipped</span><div class="row wrap"><button class="quiet small">Skip selected</button><button class="quiet small">Reconnect selected</button></div></div><div class="route-section-list" id="routeSectionList"><div class="route-section"><button class="route-section-select"><strong>1. Marquette, Michigan → Duluth, Minnesota</strong><small>Driving section · recalculate for estimate</small></button><button class="quiet small route-section-action">Skip section</button></div><div class="route-section route-section-gap"><button class="route-section-select"><strong>2. Duluth, Minnesota → Theodore Roosevelt National Park, North Dakota</strong><small>Skipped — not driven</small></button><button class="quiet small route-section-action">Reconnect</button></div><div class="route-section route-section-selected"><button class="route-section-select"><strong>3. Theodore Roosevelt National Park, North Dakota → Yellowstone National Park, Wyoming</strong><small>220 mi · 4 hr 5 min driving</small></button><button class="quiet small route-section-action">Skip section</button></div></div><div class="route-waypoints-header"><strong>Road points &amp; stops</strong></div><div class="row wrap route-action-row"><button class="quiet small">＋ Road point on map</button><button class="quiet small">＋ Stop on map</button></div><div class="route-waypoint"><span class="route-waypoint-name">2. Theodore Roosevelt National Park, North Dakota<small>Stop</small></span><div class="route-waypoint-actions"><button class="quiet small">↑</button><button class="quiet small">↓</button><button class="quiet small">×</button></div></div><div class="route-time-range"><div class="two"><label class="field">Start day<input type="date"></label><label class="field">Start time<input type="time"></label></div></div></div></div></div></body></html>\`;
const sizes=[320,375,390,430,720],container=document.getElementById('cases'),runs=[];
for(const width of sizes){const div=document.createElement('div');div.className='case';const title=document.createElement('h2');title.textContent=width+' px viewport';const frame=document.createElement('iframe');frame.width=width;frame.height=680;frame.setAttribute('title','Route layout at '+width+'px');div.append(title,frame);container.append(div);frame.addEventListener('load',()=>{const doc=frame.contentDocument;const list=doc.getElementById('routeSectionList');const view=doc.documentElement.clientWidth;const spread=doc.documentElement.scrollWidth;const item=list?.getBoundingClientRect();const passed=!!list&&item.width>150&&spread<=view+1&&item.right<=view+1;title.textContent=width+'px: '+(passed?'PASS':'OVERFLOW')+' (document '+spread+'/'+view+', sections '+Math.round(item?.width||0)+')';runs.push({width,passed,spread,view,sectionWidth:item?.width||0});if(runs.length===sizes.length){document.getElementById('result').textContent=runs.every(r=>r.passed)?'ALL FIVE SIZES PASS — no horizontal overflow':'SOME SIZES FAILED — inspect panels';window.routeLayoutQA=runs;}});frame.srcdoc=sample;}
</script></body></html>
